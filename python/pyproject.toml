[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffa-compute"
dynamic = ["version"]
description = "Single-symbol research calculations"
requires-python = ">=3.11"
dependencies = ["backtesting==0.6.6", "numpy==2.3.4", "pandas==2.3.3"]

[tool.setuptools.dynamic]
version = {attr = "ffa_compute.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
