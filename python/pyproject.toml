[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffa-compute"
version = "0.1.0"
description = "Single-symbol research calculations"
requires-python = ">=3.11"
dependencies = ["backtesting==0.6.6", "numpy==2.3.4", "pandas==2.3.3"]

[tool.setuptools.packages.find]
where = ["src"]
